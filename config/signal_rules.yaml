# ============================================================
# 信号清单与触发规则（C7：无加权总分，信号逐条可验证命中率）
# —— M0 最小版：不对外输出信号，仅 F-06 日报"自选异动/明日计划"引用少量规则
# 依据：企划 v1.0 §2.5 M4 / 架构 v0.6 §6
# ============================================================

# 信号清单（占位，M0 后按价值密度启用）
signals: []

# 触发规则 → 条件式参考建议（持仓/空仓/盈利三视角；无指令式用语）
# M0 最小版：仅"跌破 20 日线 → 风险关注"一条，供 F-06 明日计划段引用
triggers:
  - id: t_break_ma20
    when: "close < MA20(adj_close)"
    advice:
      - {scope: "持仓中", action: "风险关注", condition: "收盘跌破 20 日线"}
      - {scope: "空仓",   action: "等待确认", condition: "不追跌，等企稳信号"}
      - {scope: "盈利中", action: "关注止盈", condition: "已有盈利且跌破 20 日线"}
    observation_points: ["MA20 是否收复", "量能是否萎缩"]
