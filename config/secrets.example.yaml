# ============================================================
# 凭据模板 —— 复制为 config/secrets.yaml 后填入你自己的 Key
#   Windows:  copy config\secrets.example.yaml config\secrets.yaml
#   Linux/macOS: cp config/secrets.example.yaml config/secrets.yaml
# ⚠ 真实 secrets.yaml 已被 .gitignore 忽略，切勿提交到任何仓库。
# ============================================================

ths:
  # 同花顺官方 A 股数据服务（Fuyao）
  # 获取方式：
  #   1) 打开 https://fuyao.aicubes.cn/ ，用同花顺账号登录
  #   2) 进入「API Key 管理」https://fuyao.aicubes.cn/admin
  #   3) 点击「创建 API Key」，填别名；完整 Key 只显示一次，请立即保存
  # 留空 / 不启用时：把 config/data_sources.yaml 里 ths.enabled 设为 false，走免费 akshare
  api_key: ""
  base_url: "https://fuyao.aicubes.cn"
  auth_header: "X-api-key"

llm:
  # DeepSeek（可选，仅网页端「LLM 分析」段使用）
  # 获取方式：https://platform.deepseek.com/api_keys → 创建 API Key
  # 不用时：把 config/llm.yaml 的 enabled 设为 false
  provider: "deepseek"
  api_key: ""
